name: Build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore DWOriginsAssetTool.csproj
      - name: Build
        run: dotnet build DWOriginsAssetTool.csproj -c Release --no-restore
